<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xray 管理面板</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* 顶部导航栏 */
        header {
            background-color: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        /* 主体区域 */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 状态卡片 */
        .active-node-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .card {
            background-color: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        /* 节点列表 */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8fafc;
            white-space: nowrap;
        }

        /* 按钮 */
        button {
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            margin-bottom: 20px;
        }

        .edit-btn {
            background-color: #f59e0b;
            color: white;
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
        }

        /* 表格在小屏幕下可横向滚动 */
        .table-container {
            overflow-x: auto;
        }

        /* 操作列不允许内容换行 */
        td:last-child {
            white-space: nowrap;
        }

        /* 连接测试状态不允许换行 */
        .connection-status {
            display: inline-block;
            white-space: nowrap;
            margin: 0 8px;
        }

        footer {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        /* 表单输入框 */
        #node-form input,
        #node-form select {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        /* 表单标签 */
        #node-form label {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- 顶部导航栏 -->
    <header>
        <h1>Xray 管理面板</h1>
    </header>

    <!-- 页面主体 -->
    <main>

        <!-- 系统概览 -->
        <section class="card">
            <h2>系统概览</h2>
            <p>欢迎使用 Xray 管理面板</p>
            <p>后端接口：127.0.0.1:8000</p>
            <p>节点数量：<span id="node-count">0</span></p>
            <p>
                Xray 服务状态：
                <span id="xray-status">正在获取...</span>
            </p>

            <p>
                当前运行节点：
                <span id="active-node">正在获取...</span>
            </p>

            <!-- Xray 服务控制按钮 -->
            <div id="xray-controls">

                <button type="button" id="xray-start-btn">
                    启动 Xray
                </button>

                <button type="button" id="xray-stop-btn">
                    停止 Xray
                </button>

                <button type="button" id="xray-restart-btn">
                    重启 Xray
                </button>

            </div>
        </section>

        <!-- 节点管理 -->
        <section class="card">
            <h2>节点管理</h2>

            <button class="add-btn" id="add-btn" type="button">
                + 添加节点
            </button>

        <!-- 添加节点表单 -->
        <div id="node-form-container" class="card" style="display: none;">

            <h2 id="form-title">添加节点</h2>

            <form id="node-form">

                <p>
                    <label for="node-name">节点名称：</label><br>
                    <input type="text" id="node-name" required>
                </p>

                <p>
                    <label for="node-protocol">协议：</label><br>
                    <select id="node-protocol" required>
                        <option value="vless">VLESS</option>
                        <option value="vmess">VMess</option>
                        <option value="trojan">Trojan</option>
                        <option value="shadowsocks">Shadowsocks</option>
                    </select>
                </p>

                <p>
                    <label for="node-address">服务器地址：</label><br>
                    <input type="text" id="node-address" required>
                </p>

                <p>
                    <label for="node-port">端口：</label><br>
                    <input type="number" id="node-port" min="1" max="65535" required>
                </p>

                <p>
                    <label for="node-network">传输方式：</label><br>
                    <select id="node-network">
                        <option value="tcp">TCP</option>
                        <option value="ws">WebSocket</option>
                        <option value="grpc">gRPC</option>
                    </select>
                </p>
                <p id="ws-path-container" style="display: none;">
                    <label for="node-path">WebSocket 路径：</label><br>
                    <input
                        type="text"
                        id="node-path"
                        placeholder="例如：/ws"
                    >
                </p>

                <p>
                    <label for="node-security">传输安全：</label><br>
                    <select id="node-security">
                        <option value="none">无加密</option>
                        <option value="tls">TLS</option>
                    </select>
                </p>

                <p id="server-name-container">
                    <label for="node-server-name">TLS 服务器名称（SNI）：</label><br>
                    <input type="text" id="node-server-name" placeholder="例如：www.example.com">
                </p>

                <p id="form-message"></p>

                <button type="submit" class="add-btn">保存</button>

                <button type="button" id="cancel-btn">取消</button>

            </form>

        </div>

            <!-- 节点搜索工具栏 -->
            <!-- 节点搜索工具栏 -->
            <div class="node-toolbar">

                <input
                    type="text"
                    id="node-search"
                    placeholder="搜索节点名称、地址、端口、协议..."
                >

                <select id="protocol-filter">
                    <option value="">全部协议</option>
                    <option value="vless">VLESS</option>
                    <option value="vmess">VMess</option>
                    <option value="trojan">Trojan</option>
                    <option value="shadowsocks">Shadowsocks</option>
                </select>

            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>节点名称</th>
                            <th>协议</th>
                            <th>服务器地址</th>
                            <th>端口</th>
                            <th>传输方式</th>
                            <th>安全方式</th>
                            <th>SNI</th>
                            <th>UUID</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>

                    <tbody id="nodes-body">
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <footer>
        Xray Manager © 2026
    </footer>

<script>
    // 保存当前页面的节点数据
    let currentNodes = [];
    let activeNodeId = null;
    // 渲染节点列表
    function renderNodes(nodes) {
        const tbody = document.getElementById("nodes-body");

        // 更新节点数量
        document.getElementById("node-count").textContent = nodes.length;

        // 清空旧的表格内容
        tbody.innerHTML = "";

        // 如果没有节点，显示提示信息
        if (nodes.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="11" style="text-align: center;">
                        暂无节点数据
                    </td>
                </tr>
            `;
            return;
        }

        // 遍历节点数组，逐条生成表格
        nodes.forEach(node => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${node.id}</td>
                <td>
                    ${node.name}
                    ${
                        node.id === activeNodeId
                            ? '<span class="active-node-badge">🟢 当前运行</span>'
                            : ''
                    }
                </td>
                <td>${node.protocol}</td>
                <td>${node.address}</td>
                <td>${node.port}</td>
                <td>${node.network || "tcp"}</td>
                <td>${node.security || "none"}</td>
                <td>${node.server_name || ""}</td>
                <td>
                    ${node.uuid || ""}
                    <button
                        class="copy-uuid-btn"
                        data-uuid="${node.uuid || ""}"
                        type="button"
                        ${node.uuid ? "" : "disabled"}
                    >
                        复制
                    </button>
                </td>
                <td>${node.created_at}</td>
                <td>
                    <button class="edit-btn" data-id="${node.id}" type="button">
                        编辑
                    </button>

                    <button class="generate-config-btn" data-id="${node.id}" type="button">
                        生成配置
                    </button>

                    <button class="apply-node-btn" data-id="${node.id}" type="button">
                        应用节点
                    </button>

                    <button class="test-connection-btn" data-id="${node.id}" type="button">
                        测试连接
                    </button>

                    <span class="connection-status" data-id="${node.id}">
                        未测试
                    </span>

                    <button class="delete-btn" data-id="${node.id}" type="button">
                        删除
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    }
    async function loadNodes() {
        try {
            // 请求后端节点接口
            const response = await fetch("/api/nodes");

            // 将返回的数据转换成 JavaScript 数组
            const nodes = await response.json();
            // 保存当前节点列表，供编辑按钮使用
            currentNodes = nodes;

            // 渲染节点列表
            renderNodes(nodes);

            // 获取网页中的表格主体
            const tbody = document.getElementById("nodes-body");

            // 更新节点数量
            document.getElementById("node-count").textContent = nodes.length;

        } catch (error) {
            console.error("获取节点失败：", error);
        }
    }

    // 节点搜索和协议筛选
    function searchNodes() {
        const searchText = document
            .getElementById("node-search")
            .value
            .trim()
            .toLowerCase();

        const protocolFilter = document
            .getElementById("protocol-filter")
            .value
            .toLowerCase();

        const filteredNodes = currentNodes.filter(node => {

            // 搜索文字匹配
            const searchContent = [
                node.name,
                node.address,
                node.port,
                node.protocol,
                node.network,
                node.security,
                node.server_name
            ]
                .filter(value => value !== null && value !== undefined)
                .join(" ")
                .toLowerCase();

            const matchesSearch =
                searchContent.includes(searchText);

            // 协议匹配
            const matchesProtocol =
                !protocolFilter ||
                (node.protocol || "").toLowerCase() === protocolFilter;

            // 两个条件必须同时满足
            return matchesSearch && matchesProtocol;
        });

        renderNodes(filteredNodes);
    }

    // 监听搜索框输入
    document.getElementById("node-search").addEventListener(
        "input",
        searchNodes
    );

    // 监听协议筛选变化
    document.getElementById("protocol-filter").addEventListener(
        "change",
        searchNodes
    );

    // 获取 Xray 服务状态
    async function loadXrayStatus() {
        const statusElement = document.getElementById("xray-status");

        try {
            const response = await fetch("/api/xray/status");

            if (!response.ok) {
                throw new Error("状态接口请求失败");
        }

        const result = await response.json();

        if (result.active === true) {
            statusElement.textContent = "🟢 运行中";
        } else {
            statusElement.textContent = "🔴 已停止";
        }

    } catch (error) {
        statusElement.textContent = "⚠️ 获取失败";
        console.error("获取 Xray 状态失败：", error);
    }
}

    // 获取当前运行节点
    async function loadActiveNode() {
        const activeNodeElement = document.getElementById("active-node");

        try {
            const response = await fetch("/api/xray/active-node");

            if (!response.ok) {
                throw new Error("当前节点接口请求失败");
            }

            const result = await response.json();

            if (result.active && result.node) {
                activeNodeId = result.node.id;
                activeNodeElement.textContent = result.node.name;

                if (currentNodes.length > 0) {
                    renderNodes(currentNodes);
                }
            } else {
                activeNodeId = null;
                activeNodeElement.textContent = "暂无运行节点";

                if (currentNodes.length > 0) {
                    renderNodes(currentNodes);
                }
            }

        } catch (error) {
            activeNodeElement.textContent = "⚠️ 获取失败";
            console.error("获取当前运行节点失败：", error);
        }
    }


    // 控制 Xray 服务
    async function controlXray(action) {
        try {
            const response = await fetch(`/api/xray/${action}`, {
            method: "POST"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "操作失败");
            }

            alert(result.message || "操作请求已完成");

            // 重新获取 Xray 服务状态
            await loadXrayStatus();

        } catch (error) {
            alert("操作失败：" + error.message);
        }
    }
    // 启动 Xray
    document.getElementById("xray-start-btn").addEventListener("click", function () {
        controlXray("start");
    });

    // 停止 Xray
    document.getElementById("xray-stop-btn").addEventListener("click", function () {
        if (confirm("确定要停止 Xray 服务吗？")) {
            controlXray("stop");
        }
    });

    // 重启 Xray
    document.getElementById("xray-restart-btn").addEventListener("click", function () {
        if (confirm("确定要重启 Xray 服务吗？")) {
            controlXray("restart");
        }
    });

    // 页面加载完成后，自动获取节点
    loadNodes();
    loadXrayStatus();
    loadActiveNode();
    // 每隔 5 秒自动刷新 Xray 状态
    setInterval(loadXrayStatus, 5000);
            // 获取添加节点按钮和表单容器
            const addBtn = document.getElementById("add-btn");
            const formContainer = document.getElementById("node-form-container");
            const cancelBtn = document.getElementById("cancel-btn");
            // 当前正在编辑的节点 ID，null 表示添加模式
            let editingNodeId = null;

            // 点击添加按钮，显示表单
            addBtn.addEventListener("click", function () {
                // 切换到添加模式
                editingNodeId = null;

                // 清空表单
                nodeForm.reset();

                // 修改标题
                document.getElementById("form-title").textContent = "添加节点";

                // 清空提示信息
                formMessage.textContent = "";

                // 显示表单
                formContainer.style.display = "block";
            });

            // 点击取消按钮，隐藏表单
            cancelBtn.addEventListener("click", function () {
                formContainer.style.display = "none";
            });
            // 获取添加节点表单
            const nodeForm = document.getElementById("node-form");
            // 根据安全方式控制 SNI 输入框的显示
            const securitySelect = document.getElementById("node-security");
            const serverNameContainer = document.getElementById("server-name-container");

            function updateServerNameVisibility() {
                serverNameContainer.style.display =
                    securitySelect.value === "tls" ? "" : "none";
            }

            // 监听安全方式变化
            securitySelect.addEventListener("change", updateServerNameVisibility);

            // 页面初始化时更新显示状态
            updateServerNameVisibility();
            // 根据传输方式控制 WebSocket 路径输入框的显示
            const networkSelect = document.getElementById("node-network");
            const wsPathContainer = document.getElementById("ws-path-container");

            function updateWsPathVisibility() {
                wsPathContainer.style.display =
                    networkSelect.value === "ws" ? "" : "none";
            }

            // 监听传输方式变化
            networkSelect.addEventListener("change", updateWsPathVisibility);

            // 页面初始化时更新显示状态
            updateWsPathVisibility();

            // 获取提示信息区域
            const formMessage = document.getElementById("form-message");

            // 监听表单提交事件
            nodeForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                // 获取表单数据
                const nodeData = {
                    name: document.getElementById("node-name").value.trim(),
                    protocol: document.getElementById("node-protocol").value,
                    address: document.getElementById("node-address").value.trim(),
                    port: Number(document.getElementById("node-port").value),
                    network: document.getElementById("node-network").value,
                    security: document.getElementById("node-security").value,
                    server_name: document.getElementById("node-server-name").value.trim(),
                    path: document.getElementById("node-path").value.trim()
                };

                // 根据当前模式选择请求方式和地址
                const isEditing = editingNodeId !== null;

                const url = isEditing
                    ? `/api/nodes/${editingNodeId}`
                    : "/api/nodes";

                const method = isEditing ? "PUT" : "POST";

                try {
                    // 发送请求
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(nodeData)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.detail || "操作失败");
                    }

                    // 显示成功提示
                    formMessage.textContent = isEditing
                        ? "节点修改成功"
                        : "节点添加成功，ID：" + result.id;

                    // 退出编辑模式
                    editingNodeId = null;

                    // 清空表单
                    nodeForm.reset();

                    // 刷新节点列表
                    await loadNodes();

                    // 保存成功后关闭表单
                    formContainer.style.display = "none";
                    document.getElementById("form-title").textContent = "添加节点";

                    } catch (error) {
                    formMessage.textContent = "操作失败：" + error.message;
                }
            });
            // 监听节点表格中的删除按钮
            const nodesBody = document.getElementById("nodes-body");

            nodesBody.addEventListener("click", async function (event) {

                // =========================
                // 编辑节点
                // =========================
                const editButton = event.target.closest(".edit-btn");

                if (editButton) {
                    const nodeId = Number(editButton.dataset.id);

                    const node = currentNodes.find(item => item.id === nodeId);

                    if (!node) {
                        alert("没有找到这个节点");
                        return;
                    }

                    editingNodeId = nodeId;

                    document.getElementById("node-name").value = node.name;
                    document.getElementById("node-protocol").value = node.protocol;
                    document.getElementById("node-address").value = node.address;
                    document.getElementById("node-port").value = node.port;

                    document.getElementById("node-network").value =
                        node.network || "tcp";

                    document.getElementById("node-security").value =
                        node.security || "none";

                    document.getElementById("node-server-name").value =
                        node.server_name || "";

                    document.getElementById("node-path").value =
                        node.path || "";

                    updateWsPathVisibility();
                    updateServerNameVisibility();

                    document.getElementById("form-title").textContent = "编辑节点";

                    formMessage.textContent = "";

                    formContainer.style.display = "block";

                    formContainer.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                    return;
                }


                // =========================
                // 复制 UUID
                // =========================
                const copyButton = event.target.closest(".copy-uuid-btn");

                if (copyButton) {
                    const uuid = copyButton.dataset.uuid;

                    navigator.clipboard.writeText(uuid)
                        .then(() => {
                            alert("UUID 已复制！");
                        })
                        .catch(() => {
                            alert("复制失败，请检查浏览器权限。");
                        });

                    return;
                }


                // =========================
                // 测试节点连接
                // =========================
                const testButton = event.target.closest(".test-connection-btn");

                if (testButton) {
                    const nodeId = testButton.dataset.id;

                    const statusElement = document.querySelector(
                        `.connection-status[data-id="${nodeId}"]`
                    );

                    testButton.textContent = "测试中...";
                    testButton.disabled = true;
                    statusElement.textContent = "⏳ 测试中...";

                    try {
                        const response = await fetch(
                            `/api/nodes/${nodeId}/test-connection`,
                            {
                                method: "POST"
                            }
                        );

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(result.detail || "测试请求失败");
                        }

                        if (result.success) {
                            statusElement.textContent =
                                `🟢 连接成功 · ${result.latency_ms} ms`;
                        } else {
                            statusElement.textContent =
                                `🔴 连接失败 · ${result.message}`;
                        }

                    } catch (error) {
                        alert(`测试请求失败：${error.message}`);

                    } finally {
                        testButton.textContent = "测试连接";
                        testButton.disabled = false;
                    }

                    return;
                }


                // =========================
                // 生成 Xray 配置
                // =========================
                const generateButton = event.target.closest(".generate-config-btn");

                if (generateButton) {
                    const nodeId = generateButton.dataset.id;

                    const configWindow = window.open("", "_blank");

                    if (!configWindow) {
                        alert("新标签页被浏览器拦截，请允许弹出窗口后重试。");
                        return;
                    }

                    try {
                        const response = await fetch(
                            `/api/nodes/${nodeId}/generate-config`,
                            {
                                method: "POST"
                            }
                        );
                        const result = await response.json();

                        if (!response.ok) {
                            const requestError = new Error(
                                result.detail || "生成配置失败"
                            );

                            requestError.status = response.status;

                            throw requestError;
                        }

                        const configText = JSON.stringify(
                            result.config,
                            null,
                            2
                        );

                        configWindow.document.title =
                            `节点 ${nodeId} 的 Xray 配置`;

                        const downloadButton =
                            configWindow.document.createElement("button");

                        downloadButton.textContent = "下载配置";
                        downloadButton.style.padding = "10px 20px";
                        downloadButton.style.margin = "15px";
                        downloadButton.style.cursor = "pointer";

                        const pre =
                            configWindow.document.createElement("pre");

                        pre.textContent = configText;

                        downloadButton.addEventListener("click", () => {
                            const blob = new Blob(
                                [configText],
                                {
                                    type: "application/json;charset=utf-8"
                                }
                            );

                            const url = URL.createObjectURL(blob);

                            const link =
                                configWindow.document.createElement("a");

                            link.href = url;
                            link.download = `node_${nodeId}.json`;

                            configWindow.document.body.appendChild(link);

                            link.click();

                            link.remove();

                            URL.revokeObjectURL(url);
                        });

                        const status =
                            configWindow.document.createElement("div");

                        if (result.validation === "passed") {
                            status.textContent =
                                "✅ Xray 配置检查通过";

                            status.style.color = "green";
                        } else {
                            status.textContent =
                                "⚠️ 未获取到配置检查结果";

                            status.style.color = "orange";
                        }

                        status.style.fontSize = "18px";
                        status.style.fontWeight = "bold";
                        status.style.margin = "15px";

                        configWindow.document.body.replaceChildren(
                            status,
                            downloadButton,
                            pre
                        );

                    } catch (error) {

                        const status =
                            configWindow.document.createElement("div");

                        if (error instanceof TypeError) {
            
                            status.textContent =
                                "⚠️ 后端连接失败，请检查服务状态";

                            status.style.color = "orange";

                        } else if (error.status === 400) {

                            status.textContent =
                                "❌ Xray 配置校验失败";

                            status.style.color = "red";

                        } else if (error.status >= 500) {

                            status.textContent =
                                "❌ 服务器内部错误，请检查后端日志";

                            status.style.color = "red";

                        } else if (error.status) {

                            status.textContent =
                                `❌ 请求失败（HTTP ${error.status}）`;

                            status.style.color = "red";

                        } else {

                            status.textContent =
                                "❌ 配置生成失败";

                            status.style.color = "red";
                        }

                        status.style.fontSize = "20px";
                        status.style.fontWeight = "bold";
                        status.style.margin = "15px";

                        const errorDetail =
                            configWindow.document.createElement("pre");

                        errorDetail.textContent = error.message;
                        errorDetail.style.color = "red";
                        errorDetail.style.whiteSpace = "pre-wrap";
                        errorDetail.style.margin = "15px";

                        configWindow.document.body.replaceChildren(
                            status,
                            errorDetail
                        );
                    }

                    return;
                }

                // =========================
                // 应用节点配置
                // =========================
                const applyButton = event.target.closest(".apply-node-btn");

                if (applyButton) {
                    const nodeId = applyButton.dataset.id;

                    const confirmed = confirm(
                        `确定要应用节点 ${nodeId} 吗？\n\n应用后会替换当前 Xray 配置并重启 Xray。`
                    );

                    if (!confirmed) {
                        return;
                    }

                    applyButton.disabled = true;
                    applyButton.textContent = "应用中...";

                    try {
                        const response = await fetch(
                            `/api/nodes/${nodeId}/apply`,
                            {
                                method: "POST"
                            }
                        );

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.detail || "应用节点失败"
                            );
                        }

                        alert(
                            `✅ 节点应用成功\n\n当前节点：${result.node_id}`
                        );

                        // 刷新 Xray 状态
                        await loadXrayStatus();

                        // 刷新当前运行节点
                        await loadActiveNode();

                    } catch (error) {
                        console.error("应用节点失败：", error);

                        alert(
                            `❌ 应用节点失败\n\n${error.message}`
                        );

                    } finally {
                        applyButton.disabled = false;
                        applyButton.textContent = "应用节点";
                    }

                    return;
                }


                // =========================
                // 删除节点
                // =========================
                const deleteButton = event.target.closest(".delete-btn");

                if (deleteButton) {
                    const nodeId = deleteButton.dataset.id;

                    const confirmed =
                        confirm("确定要删除这个节点吗？");

                    if (!confirmed) {
                        return;
                    }

                    try {
                        const response = await fetch(
                            `/api/nodes/${nodeId}`,
                            {
                                method: "DELETE"
                            }
                        );

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.detail || "删除节点失败"
                            );
                        }

                        await loadNodes();

                        alert("节点删除成功");

                    } catch (error) {
                        alert("删除失败：" + error.message);
                    }

                    return;
                }

            });
        
</script>
</body>

</html>
